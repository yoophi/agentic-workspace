[package]
name = "aw-cli"
version = "0.1.0"
edition = "2021"
description = "Workbench command-line client"

[[bin]]
name = "aw"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
libc = "0.2"
workbench-client = { path = "../../crates/workbench-client" }
workbench-protocol = { path = "../../crates/workbench-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util", "process", "net"] }

[dev-dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
uuid = { version = "1", features = ["v4"] }
tokio-tungstenite = "0.24"
tempfile = "3"
hmac = "0.12"
