[package]
name = "ask-code"
version = "0.1.0"
description = "Read-only codebase question desktop app"
authors = ["you"]
edition = "2024"

[lib]
name = "ask_code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
acp-agent-core = { path = "../../../crates/acp-agent-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
