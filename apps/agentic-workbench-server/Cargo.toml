[package]
name = "agentic-workbench-server"
version = "0.1.0"
edition = "2024"
description = "독립 Workbench 서버(044, 5단계): 데스크톱과 무관한 composition root."

[[bin]]
name = "agentic-workbench-server"
path = "src/main.rs"

[dependencies]
workbench-host = { path = "../../crates/workbench-host" }
serde_json = "1"

[dev-dependencies]
libc = "0.2"
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
