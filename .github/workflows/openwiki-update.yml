name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run OpenWiki
        if: env.OPENROUTER_API_KEY != ''
        run: >-
          pnpm exec openwiki code --update --print
          "새로 작성하거나 수정하는 OpenWiki 문서는 한국어로 작성하세요. 기술 식별자와 링크는 원문 그대로 유지하세요."
        env:
          OPENWIKI_PROVIDER: openrouter
          OPENWIKI_MODEL_ID: z-ai/glm-5.2

      - name: Report missing OpenRouter secret
        if: env.OPENROUTER_API_KEY == ''
        run: echo "OPENROUTER_API_KEY is not configured; skipping the scheduled wiki update."

      - name: Create OpenWiki update pull request
        if: env.OPENROUTER_API_KEY != ''
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: openwiki
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
