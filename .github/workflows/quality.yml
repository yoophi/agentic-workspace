name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - 045-process-supervisor

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  process-supervisor-feasibility:
    name: ProcessSupervisor feasibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - name: Compile with strict Clippy
        run: cargo clippy -p process-supervisor --all-targets -- -D warnings

      - name: Run actual target feasibility
        run: cargo test -p process-supervisor --all-targets -- --nocapture

      - name: Probe macOS Endpoint Security deployment prerequisites
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/check-macos-endpoint-security-feasibility.sh

      - name: Run delegated cgroup birth-placement feasibility
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test_bin="$(find target/debug/deps -maxdepth 1 -type f -executable -name 'platform_feasibility-*' | head -n 1)"
          test -n "$test_bin"
          test_bin="$(realpath "$test_bin")"
          sudo systemd-run \
            --wait \
            --pipe \
            --collect \
            --service-type=exec \
            --unit="aw-045-delegated-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --property=Delegate=yes \
            --uid="$(id -u)" \
            --gid="$(id -g)" \
            --setenv=AW_045_DELEGATED_CGROUP=1 \
            "$test_bin" \
            --exact delegated_cgroup_birth_placement_contains_env_clear_descendant \
            --ignored \
            --nocapture

  validate:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up pnpm
        run: corepack enable

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check contract drift
        run: |
          pnpm run generate:contracts
          git diff --exit-code -- crates/workbench-protocol/openapi packages/workbench-client/src/generated

      - name: Check TypeScript
        run: pnpm run check-types

      - name: Test frontend and shared packages
        run: pnpm run test

      - name: Build frontends
        run: pnpm run build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --all-targets
