[package]
name = "workbench-desktop-client"
version = "0.1.0"
edition = "2024"
description = "Shared desktop connection, window credentials and lease lifecycle for Workbench HTTP consumers"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
workbench-host = { path = "../workbench-host" }

[dev-dependencies]
tempfile = "3"
workbench-protocol = { path = "../workbench-protocol" }
workbench-core = { path = "../workbench-core", features = ["test-hooks"] }
workbench-host = { path = "../workbench-host", features = ["test-hooks"] }
