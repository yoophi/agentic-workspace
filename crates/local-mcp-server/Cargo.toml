[package]
name = "local-mcp-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Authenticated loopback HTTP MCP host with application-provided handlers"

[dependencies]
axum = "0.8"
http = "1"
http-body-util = "0.1"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "sync", "macros"] }
tokio-util = "0.7"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "io-util"] }

