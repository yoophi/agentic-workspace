[package]
name = "workbench-client"
version = "0.1.0"
edition = "2021"
description = "Independent HTTP/WS caller for an existing Workbench server"

[dependencies]
workbench-protocol = { path = "../workbench-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
hmac = "0.12"
sha2 = "0.10"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
