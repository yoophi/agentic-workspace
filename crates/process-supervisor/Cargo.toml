[package]
name = "process-supervisor"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "process-supervisor-tree-fixture"
path = "tests/fixtures/process_tree.rs"
test = false
bench = false

[[bin]]
name = "process-supervisor-protocol-fixture"
path = "tests/fixtures/protocol_peer.rs"
test = false
bench = false

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
